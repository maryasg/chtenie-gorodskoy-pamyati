name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Skip deploy if a newer main commit exists
        id: should_deploy
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "This run (${{ github.sha }}) is no longer main HEAD. Skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      - name: Retry deploy after Pages lock (attempt 2)
        if: steps.should_deploy.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.should_deploy.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
