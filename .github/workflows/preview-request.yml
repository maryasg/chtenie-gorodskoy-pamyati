name: Build preview source

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Preview deployment is only supported for branches from this repository.
    # Fork PRs can still be reviewed manually, but should not publish to Pages.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
